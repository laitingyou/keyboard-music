[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-music"
version = "0.1.0"
description = "Play piano notes while you type — cross-platform (macOS + Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "keyboard-music" }]
keywords = ["piano", "keyboard", "music", "typing", "fluidsynth", "soundfont"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Font",
]
dependencies = [
    "pynput>=1.7,<2",
    "requests>=2.31",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-CoreGraphics>=10.0"]  # for AXIsProcessTrusted
dev = ["pytest>=7.4", "pytest-mock>=3.11"]

[project.scripts]
keyboard-music = "main:main"

[tool.setuptools]
py-modules = [
    "errors",
    "synth",
    "mapping",
    "sustain",
    "listener",
    "soundfont",
    "permissions",
    "visualizer",
    "chord",
    "main",
]

[tool.setuptools.package-data]
soundfonts = ["*.sha256"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"